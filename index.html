  <!-- Catches typos in content/birthdayData.js so we can explain them kindly -->
  <script>
    window.__errs = [];
    window.addEventListener('error', function (e) {
      window.__errs.push({ file: e.filename || '', line: e.lineno || 0, col: e.colno || 0, msg: e.message || '' });
    });
  </script>

<body class="is-locked" data-mood="night">

  <div class="stage" aria-hidden="true">
    <div class="stage__mood stage__mood--night"></div>
    <div class="stage__mood stage__mood--ember"></div>
    <div class="stage__mood stage__mood--rose"></div>
    <div class="stage__mood stage__mood--dusk"></div>
    <div class="stage__mood stage__mood--vault"></div>
    <div class="stage__mood stage__mood--champagne"></div>
    <canvas class="stage__dust" id="dust"></canvas>
    <div class="stage__grain"></div>
    <div class="stage__vignette"></div>
  </div>

  <div class="progress" id="progress" aria-hidden="true"><i></i></div>

  <div id="screens"></div>
  <main class="story" id="story"></main>
  <div id="player-root"></div>
  <div id="lightbox-root"></div>
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>

  <noscript>
    <div class="fatal" style="display:flex">
      <div class="fatal__box">
        <p>This surprise needs JavaScript to be turned on in your browser.</p>
